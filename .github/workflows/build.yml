name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'res/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'res/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        build_type: [Release, Debug]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoRun-${{ matrix.build_type }}
          path: build/${{ matrix.build_type }}/GoRun.exe
          retention-days: 30

  run-tests:
    runs-on: windows-latest
    needs: build-windows
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Debug
        
      - name: Build tests
        run: cmake --build build --config Debug --target GoRunTests --parallel
        
      - name: Run tests
        run: |
          cd build
          ctest -C Debug --output-on-failure
