[package]
name = "GoRun"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
slint-build = "1.7"

[features]
default = ["backend-winit"]
backend-winit = ["slint/backend-winit"]
testing = ["slint/testing"]

[dependencies]
slint = { version = "1.7", default-features = false, features = ["renderer-skia", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = "0.25"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell_Common",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "implement",
] }
tray-icon = "0.14"

[profile.release]
opt-level = 3
lto = true
