# GoRun Rust rewrite
[package]
name = "GoRun"
version = "1.0.0"
edition = "2021"
# MSRV 由依赖链决定：slint 1.17 及其 build/backend 依赖均要求 rustc 1.92。
# 项目自身 edition 2021 无更高要求；1.75 声明与实际不符（无法构建），已修正。
rust-version = "1.92"
build = "build.rs"
# 注：Windows GUI 子系统由 src/main.rs 的 #![windows_subsystem = "windows"] 指定。
# rustc 1.100 移除了 -C windows-subsystem，Cargo.toml 的 package.windows_subsystem 键
# 已失效（cargo 报 unused manifest key），故不在此设置。

[build-dependencies]
slint-build = "=1.17.1"
# Windows 产物嵌入 app.ico（exe/任务栏/托盘图标）；仅 windows target 时在 build.rs 中调用
winresource = "0.1"

[features]
default = ["backend-winit"]
backend-winit = ["slint/backend-winit"]
backend-testing = ["slint/system-testing", "dep:i-slint-backend-testing"]

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["renderer-software", "compat-1-2", "raw-window-handle-06"] }
i-slint-backend-testing = { version = "=1.17.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# 仅用 PNG 编解码写图标缓存；default 集含 exr/ravif/qoi/gif/webp 等无关格式（体积 +2~3MB）。
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
chrono = "0.4"
pinyin = "0.10"
raw-window-handle = "0.6"
hmac = "0.12"
sha2 = "0.10"

# Windows 平台专属依赖：仅 Windows 目标声明，避免 Linux 构建报 unused dependency。
# features 虽未被 rs/ 源码直接引用，但 windows-rs 内部 item（如 ShellExecuteExW/
# SHELLEXECUTEINFOW）被其 cfg 依赖，删除会导致 unresolved import，故保留。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
# 体积优化：去除调试/符号表；panic 直接中止（GUI 已有 panic_hook 记录，无需展开栈）；
# 单编译单元配合 lto 进一步压缩。预计 exe 9.3MB → ~4-5MB。
strip = "symbols"
panic = "abort"
codegen-units = 1
