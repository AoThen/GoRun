# GoRun Rust rewrite
[package]
name = "GoRun"
version = "1.0.0"
edition = "2021"
# MSRV 由依赖链决定：slint 1.18 及其 build/backend 依赖均要求 rustc 1.92。
# 项目自身 edition 2021 无更高要求；1.75 声明与实际不符（无法构建），已修正。
rust-version = "1.92"
build = "build.rs"
# 注：Windows GUI 子系统由 src/main.rs 的 #![windows_subsystem = "windows"] 指定。
# rustc 1.100 移除了 -C windows-subsystem，Cargo.toml 的 package.windows_subsystem 键
# 已失效（cargo 报 unused manifest key），故不在此设置。

[build-dependencies]
slint-build = "=1.18.1"
# Windows 产物嵌入 app.ico（exe/任务栏/托盘图标）；仅 windows target 时在 build.rs 中调用
winresource = "0.1"

[features]
default = ["backend-winit"]
backend-winit = ["slint/backend-winit"]
backend-testing = ["slint/system-testing", "dep:i-slint-backend-testing"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["renderer-software", "compat-1-2", "raw-window-handle-06"] }
i-slint-backend-testing = { version = "=1.18.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
# 解码用途：图标缓存写 PNG；背景图读 PNG/JPG；图标显示走 image 解码（与背景图
# 同管线），需覆盖自定义图标选择器接受的格式（ico/bmp/png/jpg，见编辑对话框过滤器）。
# default 集含 exr/ravif/qoi/gif/webp 等无关格式（体积 +2~3MB），故仅显式启用。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp"] }
# 日志档位运行时可调（设置项：warn/info/debug）；编译期保留到 debug 级别宏，
# release 下由 log::set_max_level 按设置过滤（未设置默认 Info，隐私收敛）。
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
chrono = "0.4"
pinyin = "0.10"
raw-window-handle = "0.6"
# 设置页"字体"选择：枚举系统已安装字体族。Slint 渲染端内部同用 fontdb
# 做字体匹配（版本随依赖树锁定 0.24），枚举结果与可渲染字体天然一致；
# 仅在打开设置页时后台线程调用一次，结果缓存复用。
fontdb = "0.24"

# Windows 平台专属依赖：仅 Windows 目标声明，避免 Linux 构建报 unused dependency。
# features 虽未被 rs/ 源码直接引用，但 windows-rs 内部 item（如 ShellExecuteExW/
# SHELLEXECUTEINFOW）被其 cfg 依赖，删除会导致 unresolved import，故保留。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
] }
# implement 宏展开引用 windows_core 路径，需显式依赖方可解析
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = true
# 体积优化：去除调试/符号表；panic 直接中止（GUI 已有 panic_hook 记录，无需展开栈）；
# 单编译单元配合 lto 进一步压缩。预计 exe 9.3MB → ~4-5MB。
strip = "symbols"
panic = "abort"
codegen-units = 1

# 裁剪版 lints：仅启用当前零告警的高价值 lint，用于防回归。
# 完整 BeautifulRust 配置（含 pedantic 组 + as_conversions/cast_*/unwrap_used/
# clone_on_ref_ptr 等）会触发 1.8 万+ 既有告警，淹没构建且与 Windows FFI 代码
# 的既有风格（大量 `as` 转换）冲突，故不引入。仅启用项目已满足的项。
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# CI clippy 首跑（1.99.0 stable）暴露的存量告警：一次性整改超出本任务范围
# 且高风险（FFI 密集模块），先降级为 allow 并记录，待专项清理后恢复。
# elided_lifetimes_in_paths 等为 Windows 侧/跨平台代码的待清理项，属批次 B。
elided_lifetimes_in_paths = "allow"
unused_variables = "allow"
unused_unsafe = "allow"
unused_must_use = "allow"

[lints.clippy]
panic_in_result_fn = "warn"
# CI clippy 首跑（1.99.0 stable）暴露的存量告警：一次性整改超出本任务范围
# 且高风险（FFI 密集模块），先降级为 allow 并记录，待专项清理后恢复。
# multiple_unsafe_ops_per_block 为 Windows FFI 大 unsafe 块的待清理项（批次 B）。
multiple_unsafe_ops_per_block = "allow"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
# 批次 A 已清理并恢复为 warn：本地（Linux）存量告警已清零，且无 FFI 特有代码
# 嫌疑。批次 B 仍为 allow 的项（manual_div_ceil/redundant_closure/
# unnecessary_mut_passed/chunks_exact_to_as_chunks/manual_dangling_ptr/
# unnecessary_cast）为 Windows FFI 模块（tray/dragdrop/clipboard/hotkey/
# icon_cache/runner）的待清理项，依赖 Windows CI 验证后再恢复。
assertions_on_constants = "warn"
bool_assert_comparison = "warn"
field_reassign_with_default = "warn"
manual_div_ceil = "allow"
redundant_closure = "allow"
too_many_arguments = "warn"
unnecessary_mut_passed = "allow"
chunks_exact_to_as_chunks = "allow"
doc_lazy_continuation = "warn"
manual_dangling_ptr = "allow"
unnecessary_cast = "allow"
