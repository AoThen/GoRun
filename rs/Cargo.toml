[package]
name = "GoRun"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
slint-build = "1.7"

[features]
default = ["backend-winit"]
backend-winit = ["slint/backend-winit"]

[dependencies]
slint = { version = "1.7", default-features = false, features = ["renderer-software", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = "0.25"

[profile.release]
opt-level = 3
lto = true
