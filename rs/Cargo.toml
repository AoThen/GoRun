# GoRun Rust rewrite
[package]
name = "GoRun"
version = "1.0.0"
edition = "2021"
build = "build.rs"
windows_subsystem = "windows"

[build-dependencies]
slint-build = "1.7"

[features]
default = ["backend-winit"]
backend-winit = ["slint/backend-winit"]
backend-testing = ["slint/system-testing", "dep:i-slint-backend-testing"]

[dependencies]
slint = { version = "1.7", default-features = false, features = ["renderer-software", "compat-1-2", "raw-window-handle-06"] }
i-slint-backend-testing = { version = "1.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = "0.25"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
chrono = "0.4"
windows = { version = "0.57", features = [
    "implement",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
windows-core = "0.57"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
